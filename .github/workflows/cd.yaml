---
name: CD

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  deploy:
    name: Docker Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout from Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GHCR requires a lowercase path; ${VAR,,} lowercases it. Everything is
      # derived from the repository this workflow runs in, so child projects
      # forked from this template don't need to touch this file.
      - name: Compute image reference
        id: image
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        # COMPOSER_AUTH is only needed for a project requiring a private VCS
        # package (see docs/private-packages.md) - harmless empty otherwise.
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_GITHUB_TOKEN && format('{{"github-oauth":{{"github.com":"{0}"}}}}', secrets.COMPOSER_GITHUB_TOKEN) || '' }}
        run: docker compose -f compose.yaml -f compose.prod.yaml build

      - name: Tag and push image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker tag app-php-prod "$IMAGE_REF:$VERSION"
          docker tag app-php-prod "$IMAGE_REF:latest"
          docker push "$IMAGE_REF:$VERSION"
          docker push "$IMAGE_REF:latest"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          NOTES=$(cat <<EOF
          ## Docker Image
          Docker image for this release: \`$IMAGE_REF:$VERSION\`

          All versions of the image can be viewed [here](https://github.com/$GITHUB_REPOSITORY/pkgs/container/${GITHUB_REPOSITORY#*/}).
          EOF
          )
          gh release create "$VERSION" --title "$VERSION" --notes "$NOTES"
