---
name: CI

on:
  push:
    branches:
      - master
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # This template stays an unbootstrapped skeleton on its own default branch
  # (composer.json is "{}") - the frankenphp_test stage needs a real Symfony
  # project (bin/console, real composer scripts) to build at all, so skip the
  # Tests job until a project has actually been created from the template.
  check:
    name: Check for a bootstrapped project
    runs-on: ubuntu-latest
    outputs:
      bootstrapped: ${{ steps.check.outputs.bootstrapped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check
        id: check
        run: |
          if [ "$(cat composer.json)" = '{}' ]; then
            echo "Still the bare symfony-docker template - nothing to build or test yet."
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    needs: check
    if: needs.check.outputs.bootstrapped == 'true'
    runs-on: ubuntu-latest
    env:
      # Every bare "docker compose" below needs this: Compose otherwise
      # defaults to compose.yaml + compose.override.yaml (the dev image,
      # never built here), not the compose.ci.yaml image actually built by
      # the Build Docker images step.
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # This template is reused across projects at different stages, so CI
      # detects what's actually installed instead of assuming Doctrine/PHPUnit/PHPStan.
      - name: Check for Doctrine
        id: check_doctrine
        run: |
          if [ -f "config/packages/doctrine.yaml" ] || grep -q '"doctrine/orm"' composer.json 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for PHPUnit
        id: check_phpunit
        run: |
          if [ -d "tests" ] && find tests/ -name "*Test.php" -type f | grep -q .; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for PHPStan
        id: check_phpstan
        run: |
          if [ -f "phpstan.dist.neon" ] || [ -f "phpstan.neon" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        # COMPOSER_AUTH is only needed for a project requiring a private VCS
        # package (see docs/private-packages.md) - harmless empty otherwise.
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_GITHUB_TOKEN && format('{{"github-oauth":{{"github.com":"{0}"}}}}', secrets.COMPOSER_GITHUB_TOKEN) || '' }}
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.ci.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/master
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test

      - name: Create test database
        if: steps.check_doctrine.outputs.enabled == 'true'
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Create diff migration
        if: steps.check_doctrine.outputs.enabled == 'true'
        run: |
          if ! find migrations/ -iname "Version*.php" -print -quit | grep -q .; then
            echo "No migrations detected - generating an initial one."
            docker compose exec -T php bin/console -e test doctrine:migrations:diff --no-interaction
          fi
      - name: Run migrations
        if: steps.check_doctrine.outputs.enabled == 'true'
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Doctrine Schema Validator
        if: steps.check_doctrine.outputs.enabled == 'true'
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: Run PHPUnit
        if: steps.check_phpunit.outputs.enabled == 'true'
        run: docker compose exec -T php bin/phpunit
      - name: Run PHPStan
        if: steps.check_phpstan.outputs.enabled == 'true'
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress --memory-limit=1G
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          # Any of these four make super-linter run its own "composer install"
          # before linting - the Tests job's dedicated PHPStan step (real
          # environment, real vendor/) already covers PHP static analysis;
          # super-linter's slim image's own PHP is missing ext-xml, which any
          # Symfony project's framework-bundle requires, so that composer
          # install always fails here regardless of the project's own code.
          VALIDATE_PHP: false
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
