---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    # Optional, git-ignored, only needed once a private Kowada package (e.g.
    # kowada-gmbh/starter-bundle) is required via a VCS repository: put
    # COMPOSER_AUTH=<composer's auth.json format, compact JSON, unquoted> in it,
    # e.g. COMPOSER_AUTH={"github-oauth":{"github.com":"<token>"}}
    env_file:
      - path: .env.local
        required: false
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: '${XDEBUG_MODE:-develop}'
      APP_ENV: '${APP_ENV:-dev}'
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
  ###> symfony/mercure-bundle ###
  ###< symfony/mercure-bundle ###

  database:
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5432}
        protocol: tcp

  # Consumes the "async" transport routed via MESSENGER_TRANSPORT_DSN (see compose.yaml)
  # and the "scheduler_default" schedule (see src/Schedule.php, added by symfony/scheduler's
  # recipe). After "composer require symfony/messenger symfony/scheduler": uncomment the
  # "async:" transport line in config/packages/messenger.yaml, it ships commented out by
  # default - this container fails its healthcheck until it's a real transport.
  messenger:
    image: ${IMAGES_PREFIX:-}app-php-dev
    volumes:
      - ./:/app
      - /app/vendor
    # See the "php" service above - this container's vendor/ is its own anonymous
    # volume (not the bind-mounted one), so it needs the same COMPOSER_AUTH to
    # install private packages independently.
    env_file:
      - path: .env.local
        required: false
    # More verbose than prod, and recycles often enough to pick up code changes.
    command: php bin/console messenger:consume async scheduler_default -vv --time-limit=3600 --memory-limit=256M

  # "composer require symfony/orm-pack" also injects doctrine/doctrine-bundle's own
  # "database" port mapping here - delete its content (keep the markers) after installing,
  # the "database" override above already exposes the port.
  ###> doctrine/doctrine-bundle ###
  ###< doctrine/doctrine-bundle ###
